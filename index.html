<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        canvas {
            border: 2px solid #0ff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        #ui-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #0ff;
            font-size: 24px;
            z-index: 10;
            pointer-events: none;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #0ff;
            font-family: 'Courier New', monospace;
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
        }

        #start-screen h1, #game-over-screen h1 {
            font-size: 48px;
            text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
            margin-bottom: 20px;
        }

        #start-screen p, #game-over-screen p {
            font-size: 18px;
            margin-bottom: 10px;
            color: #aaa;
        }

        #game-over-screen .final-score {
            font-size: 36px;
            color: #ff0;
            margin: 20px 0;
            text-shadow: 0 0 15px #ff0;
        }

        .btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s;
            pointer-events: all;
        }

        .btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }

        .controls-info {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div id="start-screen">
    <h1>SPACE SHOOTER</h1>
    <p>Vernichte die feindlichen Raumschiffe!</p>
    <div class="controls-info">
        ← → oder A/D — Bewegen<br>
        LEERTASTE — Schießen<br>
        P — Pause
    </div>
    <button class="btn" onclick="startGame()">STARTEN</button>
</div>

<div id="game-over-screen" style="display:none;">
    <h1>GAME OVER</h1>
    <div class="final-score" id="final-score">0</div>
    <p>Erreichte Welle: <span id="final-wave">1</span></p>
    <button class="btn" onclick="startGame()">NOCHMAL</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// === CANVAS SETUP ===
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = 600;
const HEIGHT = 800;
canvas.width = WIDTH;
canvas.height = HEIGHT;

// === GAME STATE ===
let gameRunning = false;
let paused = false;
let score = 0;
let lives = 3;
let wave = 1;
let waveTimer = 0;
let enemySpawnRate = 60; // frames between spawns
let frameCount = 0;
let shakeAmount = 0;

// === STARS (Background) ===
const stars = [];
for (let i = 0; i < 150; i++) {
    stars.push({
        x: Math.random() * WIDTH,
        y: Math.random() * HEIGHT,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 2 + 0.5,
        brightness: Math.random()
    });
}

// === PLAYER ===
const player = {
    x: WIDTH / 2,
    y: HEIGHT - 80,
    width: 40,
    height: 40,
    speed: 6,
    shootCooldown: 0,
    shootRate: 12,
    invincible: 0
};

// === ARRAYS ===
let bullets = [];
let enemies = [];
let particles = [];
let powerUps = [];

// === INPUT ===
const keys = {};
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyP' && gameRunning) {
        paused = !paused;
    }
    if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
        e.preventDefault();
    }
});
document.addEventListener('keyup', e => {
    keys[e.code] = false;
});

// === ENEMY TYPES ===
const enemyTypes = [
    { // Basic
        width: 30, height: 30, hp: 1, speed: 2, score: 10,
        color: '#f44', shootChance: 0
    },
    { // Fast
        width: 25, height: 25, hp: 1, speed: 4, score: 20,
        color: '#ff0', shootChance: 0
    },
    { // Tank
        width: 45, height: 45, hp: 3, speed: 1.2, score: 30,
        color: '#f0f', shootChance: 0.005
    },
    { // Shooter
        width: 35, height: 35, hp: 2, speed: 1.5, score: 40,
        color: '#0f0', shootChance: 0.01
    }
];

// === FUNCTIONS ===
function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';

    score = 0;
    lives = 3;
    wave = 1;
    waveTimer = 0;
    enemySpawnRate = 55;
    frameCount = 0;
    shakeAmount = 0;

    player.x = WIDTH / 2;
    player.y = HEIGHT - 80;
    player.shootCooldown = 0;
    player.invincible = 0;

    bullets = [];
    enemies = [];
    particles = [];
    powerUps = [];

    gameRunning = true;
    paused = false;
    requestAnimationFrame(gameLoop);
}

function spawnEnemy() {
    let typeIndex = 0;
    const r = Math.random();
    if (wave >= 5 && r < 0.15) typeIndex = 3;
    else if (wave >= 3 && r < 0.3) typeIndex = 2;
    else if (wave >= 2 && r < 0.5) typeIndex = 1;

    const type = enemyTypes[typeIndex];
    const enemy = {
        x: Math.random() * (WIDTH - type.width - 40) + 20,
        y: -type.height,
        ...type,
        maxHp: type.hp,
        type: typeIndex,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: (Math.random() - 0.5) * 0.05
    };
    enemies.push(enemy);
}

function spawnParticles(x, y, color, count, spread) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * spread + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: Math.random() * 0.03 + 0.02,
            size: Math.random() * 4 + 1,
            color
        });
    }
}

function drawPlayer() {
    if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) return;

    ctx.save();
    ctx.translate(player.x, player.y);

    // Ship body
    ctx.fillStyle = '#0ff';
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(-18, 18);
    ctx.lineTo(-8, 12);
    ctx.lineTo(0, 16);
    ctx.lineTo(8, 12);
    ctx.lineTo(18, 18);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    // Engine glow
    if (frameCount % 4 < 2) {
        ctx.fillStyle = '#f80';
        ctx.beginPath();
        ctx.moveTo(-6, 16);
        ctx.lineTo(0, 26 + Math.random() * 6);
        ctx.lineTo(6, 16);
        ctx.closePath();
        ctx.fill();
    }

    ctx.restore();
}

function drawEnemy(enemy) {
    ctx.save();
    ctx.translate(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);

    const hpRatio = enemy.hp / enemy.maxHp;

    if (enemy.type === 0) {
        // Basic - red triangle pointing down
        ctx.fillStyle = enemy.color;
        ctx.beginPath();
        ctx.moveTo(0, 15);
        ctx.lineTo(-15, -12);
        ctx.lineTo(15, -12);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#800';
        ctx.beginPath();
        ctx.arc(0, -2, 4, 0, Math.PI * 2);
        ctx.fill();
    } else if (enemy.type === 1) {
        // Fast - yellow diamond
        ctx.fillStyle = enemy.color;
        ctx.beginPath();
        ctx.moveTo(0, -13);
        ctx.lineTo(12, 0);
        ctx.lineTo(0, 13);
        ctx.lineTo(-12, 0);
        ctx.closePath();
        ctx.fill();
    } else if (enemy.type === 2) {
        // Tank - purple hexagon
        ctx.fillStyle = enemy.color;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i - Math.PI / 6;
            const px = Math.cos(angle) * 22;
            const py = Math.sin(angle) * 22;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        // HP bar
        ctx.fillStyle = '#333';
        ctx.fillRect(-15, -30, 30, 4);
        ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : '#f00';
        ctx.fillRect(-15, -30, 30 * hpRatio, 4);
    } else if (enemy.type === 3) {
        // Shooter - green circle with crosshair
        ctx.fillStyle = enemy.color;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#040';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-16, 0); ctx.lineTo(16, 0);
        ctx.moveTo(0, -16); ctx.lineTo(0, 16);
        ctx.stroke();
        // HP bar
        ctx.fillStyle = '#333';
        ctx.fillRect(-15, -26, 30, 4);
        ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : '#f00';
        ctx.fillRect(-15, -26, 30 * hpRatio, 4);
    }

    ctx.restore();
}

function drawBullet(bullet) {
    if (bullet.isEnemy) {
        ctx.fillStyle = '#f44';
        ctx.shadowColor = '#f44';
    } else {
        ctx.fillStyle = '#0ff';
        ctx.shadowColor = '#0ff';
    }
    ctx.shadowBlur = 8;
    ctx.fillRect(bullet.x - 2, bullet.y - 6, 4, 12);
    ctx.shadowBlur = 0;
}

function drawHUD() {
    // Score
    ctx.fillStyle = '#0ff';
    ctx.font = '20px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(`PUNKTE: ${score}`, 15, 35);

    // Wave
    ctx.textAlign = 'center';
    ctx.fillText(`WELLE ${wave}`, WIDTH / 2, 35);

    // Lives
    ctx.textAlign = 'right';
    ctx.fillStyle = '#f44';
    for (let i = 0; i < lives; i++) {
        ctx.fillText('♥', WIDTH - 15 - i * 28, 37);
    }

    // Pause indicator
    if (paused) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = '#0ff';
        ctx.font = '48px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSE', WIDTH / 2, HEIGHT / 2);
        ctx.font = '18px Courier New';
        ctx.fillText('P drücken um fortzufahren', WIDTH / 2, HEIGHT / 2 + 40);
    }
}

function rectCollision(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
}

function update() {
    if (paused) return;
    frameCount++;

    // === PLAYER MOVEMENT ===
    if (keys['ArrowLeft'] || keys['KeyA']) {
        player.x -= player.speed;
    }
    if (keys['ArrowRight'] || keys['KeyD']) {
        player.x += player.speed;
    }
    player.x = Math.max(20, Math.min(WIDTH - 20, player.x));

    // === SHOOTING ===
    if (player.shootCooldown > 0) player.shootCooldown--;
    if (keys['Space'] && player.shootCooldown <= 0) {
        bullets.push({
            x: player.x,
            y: player.y - 20,
            speed: 8,
            isEnemy: false
        });
        player.shootCooldown = player.shootRate;
    }

    // === INVINCIBILITY ===
    if (player.invincible > 0) player.invincible--;

    // === SPAWN ENEMIES ===
    if (frameCount % Math.max(15, enemySpawnRate) === 0) {
        spawnEnemy();
    }

    // === WAVE SYSTEM ===
    waveTimer++;
    if (waveTimer >= 600) { // every ~10 seconds
        wave++;
        waveTimer = 0;
        enemySpawnRate = Math.max(15, 55 - wave * 4);
    }

    // === UPDATE BULLETS ===
    bullets = bullets.filter(bullet => {
        if (bullet.isEnemy) {
            bullet.y += 5;
        } else {
            bullet.y -= bullet.speed;
        }
        return bullet.y > -20 && bullet.y < HEIGHT + 20;
    });

    // === UPDATE ENEMIES ===
    enemies = enemies.filter(enemy => {
        enemy.wobble += enemy.wobbleSpeed;
        enemy.y += enemy.speed;
        enemy.x += Math.sin(enemy.wobble) * 0.8;

        // Enemy shooting
        if (enemy.shootChance > 0 && Math.random() < enemy.shootChance) {
            bullets.push({
                x: enemy.x + enemy.width / 2,
                y: enemy.y + enemy.height,
                speed: 0,
                isEnemy: true
            });
        }

        // Off screen
        if (enemy.y > HEIGHT + 50) {
            return false;
        }

        // Collision with player
        if (player.invincible <= 0) {
            const playerBox = {
                x: player.x - 15, y: player.y - 15,
                width: 30, height: 30
            };
            if (rectCollision(playerBox, enemy)) {
                lives--;
                player.invincible = 90;
                shakeAmount = 10;
                spawnParticles(player.x, player.y, '#f44', 20, 4);
                if (lives <= 0) {
                    gameOver();
                }
                return false;
            }
        }

        return true;
    });

    // === BULLET-ENEMY COLLISIONS ===
    bullets = bullets.filter(bullet => {
        if (bullet.isEnemy) {
            // Enemy bullet hits player
            if (player.invincible <= 0) {
                const playerBox = {
                    x: player.x - 12, y: player.y - 12,
                    width: 24, height: 24
                };
                const bulletBox = {
                    x: bullet.x - 3, y: bullet.y - 6,
                    width: 6, height: 12
                };
                if (rectCollision(playerBox, bulletBox)) {
                    lives--;
                    player.invincible = 90;
                    shakeAmount = 8;
                    spawnParticles(player.x, player.y, '#f44', 15, 3);
                    if (lives <= 0) {
                        gameOver();
                    }
                    return false;
                }
            }
            return true;
        }

        // Player bullet hits enemy
        for (let i = 0; i < enemies.length; i++) {
            const enemy = enemies[i];
            const bulletBox = {
                x: bullet.x - 3, y: bullet.y - 6,
                width: 6, height: 12
            };
            if (rectCollision(bulletBox, enemy)) {
                enemy.hp--;
                spawnParticles(bullet.x, bullet.y, enemy.color, 5, 2);
                if (enemy.hp <= 0) {
                    score += enemy.score;
                    spawnParticles(
                        enemy.x + enemy.width / 2,
                        enemy.y + enemy.height / 2,
                        enemy.color, 25, 5
                    );
                    spawnParticles(
                        enemy.x + enemy.width / 2,
                        enemy.y + enemy.height / 2,
                        '#ff0', 15, 3
                    );
                    enemies.splice(i, 1);
                }
                return false;
            }
        }
        return true;
    });

    // === UPDATE PARTICLES ===
    particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        p.vx *= 0.98;
        p.vy *= 0.98;
        return p.life > 0;
    });

    // === SCREEN SHAKE ===
    if (shakeAmount > 0) shakeAmount *= 0.9;
    if (shakeAmount < 0.5) shakeAmount = 0;
}

function draw() {
    ctx.save();

    // Screen shake
    if (shakeAmount > 0) {
        ctx.translate(
            (Math.random() - 0.5) * shakeAmount,
            (Math.random() - 0.5) * shakeAmount
        );
    }

    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Stars
    stars.forEach(star => {
        star.y += star.speed;
        if (star.y > HEIGHT) {
            star.y = 0;
            star.x = Math.random() * WIDTH;
        }
        const flicker = 0.5 + Math.sin(frameCount * 0.05 + star.brightness * 10) * 0.3;
        ctx.fillStyle = `rgba(255, 255, 255, ${flicker})`;
        ctx.fillRect(star.x, star.y, star.size, star.size);
    });

    // Bullets
    bullets.forEach(drawBullet);

    // Enemies
    enemies.forEach(drawEnemy);

    // Player
    drawPlayer();

    // Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;

    // HUD
    drawHUD();

    ctx.restore();
}

function gameOver() {
    gameRunning = false;
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-wave').textContent = wave;
    document.getElementById('game-over-screen').style.display = 'flex';
}

function gameLoop() {
    if (!gameRunning) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Initial draw so canvas isn't blank
ctx.fillStyle = '#0a0a1a';
ctx.fillRect(0, 0, WIDTH, HEIGHT);
stars.forEach(star => {
    ctx.fillStyle = `rgba(255, 255, 255, 0.5)`;
    ctx.fillRect(star.x, star.y, star.size, star.size);
});
</script>

</body>
</html>
